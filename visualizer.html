<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAPF | CBS Playback</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f5f0;
      --panel: #fbfcf9;
      --ink: #1c302a;
      --muted: #73827a;
      --line: #d9e1d9;
      --forest: #24483c;
      --lime: #c9ed75;
      --coral: #e47755;
      --teal: #248d85;
      --gold: #d8a83d;
      --blue: #5584b8;
      --pink: #bd6081;
      --board: #e7eee6;
      --shadow: 0 20px 60px rgba(39, 65, 51, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#cbd8cb 0.7px, transparent 0.7px);
      background-size: 19px 19px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px clamp(16px, 3vw, 44px) 36px;
    }

    .topbar, .brand, .toolbar, .playback, .range-row, .section-heading, .agent-row, .metric-row {
      display: flex;
      align-items: center;
    }

    .topbar { justify-content: space-between; gap: 18px; padding-bottom: 24px; }
    .brand { gap: 12px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      color: var(--lime);
      background: var(--forest);
      font-size: 19px;
      font-weight: 800;
    }
    .brand-name { font-size: 14px; font-weight: 750; letter-spacing: .02em; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .eyebrow { color: var(--teal); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 3vw, 39px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.1;
    }
    .intro { display: flex; flex-direction: column; gap: 8px; }
    .toolbar { gap: 8px; }
    .button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .button:hover { transform: translateY(-1px); border-color: #aebeb0; }
    .button-primary { border-color: var(--forest); color: white; background: var(--forest); }
    .button-primary:hover { border-color: #315d4d; background: #315d4d; }
    .button-icon { width: 40px; padding: 0; font-size: 16px; }
    .button:focus-visible, input:focus-visible { outline: 3px solid rgba(36, 141, 133, .35); outline-offset: 2px; }
    #file-input { display: none; }

    .grid-size-controls { display: flex; align-items: end; gap: 6px; }
    .grid-size-field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 9px; font-weight: 750; }
    .grid-size-field input, .editor-name {
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: white;
      font-size: 11px;
    }
    .grid-size-field input { width: 58px; }
    .editor-name { width: 120px; }
    .grid-size-controls .button { min-height: 34px; padding: 0 10px; font-size: 11px; }
    .random-setup-button { min-height: 34px; padding: 0 11px; font-size: 11px; white-space: nowrap; }
    .editor-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #f5f8f2;
    }
    .toolset, .editor-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .edit-mode {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .edit-mode[aria-pressed="true"] { border-color: #c9d8c9; background: white; color: var(--forest); box-shadow: 0 1px 2px rgba(20, 45, 32, .06); }
    .edit-mode:hover { color: var(--ink); }
    .editor-select {
      min-height: 34px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--ink);
      font-size: 11px;
    }
    .editor-actions .button { min-height: 34px; padding: 0 10px; font-size: 11px; }
    .edit-hint { padding: 8px 17px 0; color: var(--muted); font-size: 10px; }
    .calculate-button { white-space: nowrap; }
    .calculate-button:disabled { cursor: progress; opacity: .65; transform: none; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(280px, .72fr);
      gap: 22px;
      align-items: start;
    }
    .stage, .sidebar {
      border: 1px solid rgba(217, 225, 217, .9);
      border-radius: 12px;
      background: rgba(251, 252, 249, .94);
      box-shadow: var(--shadow);
    }
    .stage { overflow: hidden; }
    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }
    .stage-title { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 750; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(36, 141, 133, .12); }
    .status {
      max-width: 45%; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap;
    }
    .canvas-wrap {
      display: grid;
      min-height: 420px;
      place-items: center;
      padding: clamp(12px, 2.2vw, 28px);
      background-image: linear-gradient(rgba(36, 72, 60, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(36, 72, 60, .025) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    canvas {
      display: block;
      width: min(100%, 680px);
      height: auto;
      aspect-ratio: 1;
      border-radius: 8px;
    }
    .playback {
      gap: 8px;
      padding: 14px 18px 17px;
      border-top: 1px solid var(--line);
    }
    .playback .button { flex: 0 0 auto; }
    .play-button { width: 42px; }
    .range-box { min-width: 0; flex: 1; padding: 0 8px; }
    .range-row { justify-content: space-between; gap: 12px; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    input[type="range"] { display: block; width: 100%; height: 5px; accent-color: var(--teal); cursor: pointer; }
    .speed-select {
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--panel);
      font-size: 11px;
    }

    .sidebar { padding: 21px; }
    .section-heading { justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 500; }
    .small-label { color: var(--muted); font-size: 10px; }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--line);
    }
    .metric { min-height: 78px; padding: 13px; background: var(--panel); }
    .metric-label { color: var(--muted); font-size: 10px; }
    .metric-value { margin-top: 7px; font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-variant-numeric: tabular-nums; }
    .section-heading .count { color: var(--muted); font-family: inherit; font-size: 11px; }
    .agent-list { display: flex; flex-direction: column; }
    .agent-row { gap: 11px; min-width: 0; padding: 12px 0; border-top: 1px solid var(--line); }
    .agent-color { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 3px; }
    .agent-info { min-width: 0; flex: 1; }
    .agent-name { overflow: hidden; font-size: 12px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .agent-route { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .agent-steps { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .conflict-status { display: flex; align-items: center; gap: 9px; margin-top: 21px; padding: 12px; border-radius: 8px; background: #e9f4e9; color: #286144; font-size: 11px; font-weight: 700; }
    .conflict-status.has-conflicts { background: #fff0e9; color: #a04f31; }
    .conflict-symbol { display: grid; width: 20px; height: 20px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: white; }
    .footer-note { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; color: var(--muted); font-size: 10px; }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .sidebar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 24px; }
      .sidebar > .section-heading:first-child { grid-column: 1 / -1; }
      .metrics { align-self: start; }
      .agents-section { grid-column: 1; }
      .conflict-status { align-self: end; }
      .footer-note { grid-column: 1 / -1; }
    }
    @media (max-width: 580px) {
      .shell { padding: 17px 12px 24px; }
      .topbar { align-items: flex-start; flex-direction: column; padding-bottom: 17px; }
      .topbar .toolbar { width: 100%; }
      .topbar .toolbar .button-primary { flex: 1; }
      .editor-bar { align-items: flex-start; flex-direction: column; padding: 11px; }
      .toolset, .editor-actions { width: 100%; }
      .grid-size-controls { width: 100%; }
      .random-setup-button { width: 100%; }
      .toolset { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .edit-mode { padding: 0 5px; font-size: 10px; }
      .editor-name { min-width: 0; flex: 1; }
      .editor-actions { flex-wrap: nowrap; }
      .workspace { gap: 14px; }
      .stage-head { padding: 14px; }
      .canvas-wrap { min-height: 0; padding: 10px; }
      .playback { flex-wrap: wrap; gap: 6px; padding: 11px; }
      .range-box { order: 5; width: 100%; flex-basis: 100%; padding: 7px 3px 0; }
      .playback .button { min-height: 36px; }
      .sidebar { display: block; padding: 16px; }
      .metrics { margin-bottom: 19px; }
      .status { max-width: 48%; }
    }
    @media (max-width: 340px) {
      .topbar .toolbar .button { padding: 0 10px; }
      .topbar .toolbar .button-primary { flex: 1; }
      .brand-sub { font-size: 10px; }
      .stage-title { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="intro">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div>
            <div class="brand-name">MAPF LAB</div>
            <div class="brand-sub">Multi-agent pathfinding</div>
          </div>
        </div>
        <div class="eyebrow">CBS / Solution playback</div>
        <h1>Robot paths</h1>
      </div>
      <div class="toolbar">
        <input id="file-input" type="file" accept="application/json,.json">
        <button class="button button-primary" id="load-button" type="button"><span aria-hidden="true">↥</span> Load result</button>
        <button class="button" id="reset-button" type="button" title="Return to the first timestep">Reset</button>
        <button class="button button-primary calculate-button" id="calculate-button" type="button"><span aria-hidden="true">▶</span> Run CBS</button>
      </div>
    </header>

    <section class="workspace" aria-label="CBS path playback">
      <div class="stage">
        <div class="stage-head">
          <div class="stage-title"><span class="live-dot" aria-hidden="true"></span><span id="stage-caption">Solution map</span></div>
          <div class="status" id="source-status" aria-live="polite">Built-in example</div>
        </div>
        <div class="editor-bar">
          <div class="grid-size-controls" aria-label="Grid size">
            <label class="grid-size-field">Columns<input id="grid-width" type="number" min="1" max="40" value="7"></label>
            <label class="grid-size-field">Rows<input id="grid-height" type="number" min="1" max="40" value="7"></label>
            <button class="button" id="resize-grid" type="button">Resize</button>
          </div>
          <button class="button random-setup-button" id="random-setup" type="button" title="Generate random robot endpoints and obstacles"><span aria-hidden="true">⤨</span> Random setup</button>
          <div class="toolset" role="toolbar" aria-label="Grid editing tools">
            <button class="edit-mode" type="button" data-mode="obstacle" aria-pressed="true">Obstacle</button>
            <button class="edit-mode" type="button" data-mode="start" aria-pressed="false">Start</button>
            <button class="edit-mode" type="button" data-mode="goal" aria-pressed="false">Goal</button>
            <button class="edit-mode" type="button" data-mode="erase" aria-pressed="false">Erase</button>
          </div>
          <div class="editor-actions">
            <select class="editor-select" id="selected-agent" aria-label="Robot to edit"></select>
            <input class="editor-name" id="agent-name" type="text" maxlength="40" aria-label="Selected robot name" placeholder="Robot name">
            <button class="button" id="add-agent" type="button" title="Add a robot">+ Robot</button>
            <button class="button button-icon" id="remove-agent" type="button" title="Remove the selected robot" aria-label="Remove the selected robot">−</button>
          </div>
        </div>
        <div class="edit-hint" id="edit-hint">Click cells to add or remove obstacles.</div>
        <div class="canvas-wrap">
          <canvas id="map" aria-label="Editable grid and animated robot paths"></canvas>
        </div>
        <div class="playback">
          <button class="button button-icon" id="previous-button" type="button" title="Previous timestep" aria-label="Previous timestep">‹</button>
          <button class="button button-primary button-icon play-button" id="play-button" type="button" title="Play animation" aria-label="Play animation">▶</button>
          <button class="button button-icon" id="next-button" type="button" title="Next timestep" aria-label="Next timestep">›</button>
          <div class="range-box">
            <div class="range-row"><span>TIME STEP</span><span id="time-label">0 / 0</span></div>
            <input id="time-range" type="range" min="0" max="1" step="0.01" value="0" aria-label="Animation time step">
          </div>
          <select id="speed-select" class="speed-select" aria-label="Animation speed">
            <option value="900">0.5×</option>
            <option value="520" selected>1×</option>
            <option value="260">2×</option>
          </select>
        </div>
      </div>

      <aside class="sidebar">
        <div class="section-heading">
          <h2>Run summary</h2>
          <span class="small-label" id="grid-label">7 × 7 grid</span>
        </div>
        <div class="metrics">
          <div class="metric"><div class="metric-label">SUM OF COSTS</div><div class="metric-value" id="cost-value">—</div></div>
          <div class="metric"><div class="metric-label">MAKESPAN</div><div class="metric-value" id="makespan-value">—</div></div>
        </div>
        <div class="agents-section">
          <div class="section-heading"><h2>Robots</h2><span class="count" id="agent-count">0 agents</span></div>
          <div class="agent-list" id="agent-list"></div>
        </div>
        <div class="conflict-status" id="conflict-status">
          <span class="conflict-symbol" id="conflict-symbol" aria-hidden="true">✓</span>
          <span id="conflict-label">No path conflicts</span>
        </div>
        <div class="footer-note"><span id="frame-label">Frame 0</span><span>Goal holds after arrival</span></div>
      </aside>
    </section>
  </main>

  <script>
    const colors = ['#e47755', '#248d85', '#d8a83d', '#5584b8', '#bd6081', '#718d48'];
    const demo = {
      width: 7,
      height: 7,
      cost: 16,
      obstacles: [[1, 1], [5, 5]],
      agents: [
        { name: 'Robot 1', start: [0, 3], goal: [6, 3], path: [[0, 3], [1, 3], [2, 3], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [6, 3]] },
        { name: 'Robot 2', start: [3, 0], goal: [3, 6], path: [[3, 0], [3, 1], [3, 2], [4, 2], [5, 2], [5, 3], [5, 4], [4, 4], [3, 4], [3, 5], [3, 6]] }
      ]
    };

    const canvas = document.querySelector('#map');
    const context = canvas.getContext('2d');
    const range = document.querySelector('#time-range');
    const playButton = document.querySelector('#play-button');
    const sourceStatus = document.querySelector('#source-status');
    const calculateButton = document.querySelector('#calculate-button');
    let scenario = {
      width: demo.width,
      height: demo.height,
      obstacles: demo.obstacles.map(point => [...point]),
      agents: demo.agents.map(({name, start, goal}) => ({name, start: [...start], goal: [...goal]}))
    };
    let result = demo;
    let frame = 0;
    let playing = false;
    let lastTick = 0;
    let frameAtTick = 0;
    let animationId = 0;
    let conflicts = [];
    let editMode = 'obstacle';
    let selectedAgent = 0;

    function validateResult(data) {
      if (!data || !Number.isInteger(data.width) || !Number.isInteger(data.height)
          || data.width < 1 || data.height < 1 || !Array.isArray(data.agents)
          || !Array.isArray(data.obstacles)) {
        throw new Error('Expected width, height, obstacles and agents in the JSON result.');
      }
      for (const [index, agent] of data.agents.entries()) {
        if (!agent || !Array.isArray(agent.path) || agent.path.length === 0
            || !agent.path.every(point => Array.isArray(point) && point.length === 2
              && Number.isInteger(point[0]) && Number.isInteger(point[1]))) {
          throw new Error(`Robot ${index + 1} has no valid path.`);
        }
      }
      return data;
    }

    function maxTime() {
      return result ? Math.max(0, ...result.agents.map(agent => agent.path.length - 1)) : 0;
    }

    function findConflicts() {
      if (!result) return [];
      const found = [];
      const horizon = maxTime();
      const at = (agent, time) => agent.path[Math.min(time, agent.path.length - 1)];
      for (let time = 0; time <= horizon; time += 1) {
        for (let first = 0; first < result.agents.length; first += 1) {
          for (let second = first + 1; second < result.agents.length; second += 1) {
            const a = at(result.agents[first], time);
            const b = at(result.agents[second], time);
            if (a[0] === b[0] && a[1] === b[1]) found.push({ type: 'vertex', time });
            if (time < horizon) {
              const aNext = at(result.agents[first], time + 1);
              const bNext = at(result.agents[second], time + 1);
              if ((a[0] !== aNext[0] || a[1] !== aNext[1])
                  && a[0] === bNext[0] && a[1] === bNext[1]
                  && aNext[0] === b[0] && aNext[1] === b[1]) {
                found.push({ type: 'edge', time });
              }
            }
          }
        }
      }
      return found;
    }

    function updatePanel() {
      const horizon = maxTime();
      updatePlaybackReadout();
      document.querySelector('#grid-label').textContent = `${scenario.width} × ${scenario.height} grid`;
      document.querySelector('#agent-count').textContent = `${scenario.agents.length} ${scenario.agents.length === 1 ? 'robot' : 'robots'}`;
      document.querySelector('#makespan-value').textContent = result ? horizon : '—';
      const sum = scenario.agents.reduce((total, agent) => total + (agent.path ? agent.path.length - 1 : 0), 0);
      document.querySelector('#cost-value').textContent = result
        ? (Number.isFinite(result.cost) ? result.cost : sum)
        : '—';
      const list = document.querySelector('#agent-list');
      list.replaceChildren(...scenario.agents.map((agent, index) => {
        const row = document.createElement('div');
        row.className = 'agent-row';
        const swatch = document.createElement('span');
        swatch.className = 'agent-color';
        swatch.style.backgroundColor = colors[index % colors.length];
        const info = document.createElement('div');
        info.className = 'agent-info';
        const name = document.createElement('div');
        name.className = 'agent-name';
        name.textContent = agent.name || `Robot ${index + 1}`;
        const route = document.createElement('div');
        route.className = 'agent-route';
        route.textContent = `${agent.start ? agent.start.join(', ') : 'start unset'}  →  ${agent.goal ? agent.goal.join(', ') : 'goal unset'}`;
        info.append(name, route);
        const steps = document.createElement('span');
        steps.className = 'agent-steps';
        const path = result && result.agents[index] ? result.agents[index].path : null;
        steps.textContent = path ? `${path.length - 1} steps` : 'not calculated';
        row.append(swatch, info, steps);
        return row;
      }));
      const status = document.querySelector('#conflict-status');
      status.classList.toggle('has-conflicts', conflicts.length > 0);
      document.querySelector('#conflict-symbol').textContent = conflicts.length > 0 ? '!' : '✓';
      document.querySelector('#conflict-label').textContent = !result
        ? 'Run CBS to check for conflicts'
        : conflicts.length > 0
          ? `${conflicts.length} conflict${conflicts.length === 1 ? '' : 's'} found`
          : 'No path conflicts';
    }

    function updatePlaybackReadout() {
      const horizon = maxTime();
      range.max = String(Math.max(1, horizon));
      range.value = String(frame);
      document.querySelector('#time-label').textContent = `${Math.floor(frame)} / ${horizon}`;
      document.querySelector('#frame-label').textContent = `Frame ${Math.floor(frame)}`;
    }

    function syncAgentSelector() {
      const select = document.querySelector('#selected-agent');
      select.replaceChildren(...scenario.agents.map((agent, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = agent.name || `Robot ${index + 1}`;
        return option;
      }));
      selectedAgent = Math.min(selectedAgent, scenario.agents.length - 1);
      select.value = String(selectedAgent);
      document.querySelector('#agent-name').value = scenario.agents[selectedAgent].name || `Robot ${selectedAgent + 1}`;
      document.querySelector('#remove-agent').disabled = scenario.agents.length <= 1;
    }

    function syncGridSizeInputs() {
      document.querySelector('#grid-width').value = String(scenario.width);
      document.querySelector('#grid-height').value = String(scenario.height);
    }

    function resizeGrid() {
      const width = document.querySelector('#grid-width').valueAsNumber;
      const height = document.querySelector('#grid-height').valueAsNumber;
      if (!Number.isInteger(width) || !Number.isInteger(height)
          || width < 1 || height < 1 || width > 40 || height > 40) {
        sourceStatus.textContent = 'Grid dimensions must be whole numbers from 1 to 40.';
        return;
      }

      scenario.width = width;
      scenario.height = height;
      scenario.obstacles = scenario.obstacles.filter(([x, y]) => x < width && y < height);
      for (const agent of scenario.agents) {
        if (agent.start && (agent.start[0] >= width || agent.start[1] >= height)) agent.start = null;
        if (agent.goal && (agent.goal[0] >= width || agent.goal[1] >= height)) agent.goal = null;
      }
      syncGridSizeInputs();
      scenarioChanged('Grid resized · run CBS to calculate');
    }

    function shuffle(values) {
      const shuffled = [...values];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
      }
      return shuffled;
    }

    function openGridIsConnected(obstacles) {
      const blocked = new Set(obstacles.map(([x, y]) => `${x},${y}`));
      const totalOpen = scenario.width * scenario.height - blocked.size;
      let firstOpen = null;
      for (let y = 0; y < scenario.height && !firstOpen; y += 1) {
        for (let x = 0; x < scenario.width; x += 1) {
          if (!blocked.has(`${x},${y}`)) {
            firstOpen = [x, y];
            break;
          }
        }
      }
      if (!firstOpen) return false;

      const visited = new Set([`${firstOpen[0]},${firstOpen[1]}`]);
      const queue = [firstOpen];
      for (let index = 0; index < queue.length; index += 1) {
        const [x, y] = queue[index];
        for (const [nextX, nextY] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          const key = `${nextX},${nextY}`;
          if (nextX >= 0 && nextX < scenario.width && nextY >= 0 && nextY < scenario.height
              && !blocked.has(key) && !visited.has(key)) {
            visited.add(key);
            queue.push([nextX, nextY]);
          }
        }
      }
      return visited.size === totalOpen;
    }

    function randomSetup() {
      const cells = [];
      for (let y = 0; y < scenario.height; y += 1) {
        for (let x = 0; x < scenario.width; x += 1) cells.push([x, y]);
      }
      const requiredCells = scenario.agents.length * 2;
      if (cells.length < requiredCells) {
        sourceStatus.textContent = `Grid needs at least ${requiredCells} cells for ${scenario.agents.length} robots.`;
        return;
      }

      const shuffled = shuffle(cells);
      const starts = shuffled.slice(0, scenario.agents.length);
      const goals = shuffled.slice(scenario.agents.length, requiredCells);
      if (scenario.width === 1 || scenario.height === 1) {
        const alongGrid = ([x1, y1], [x2, y2]) => scenario.width === 1 ? y1 - y2 : x1 - x2;
        starts.sort(alongGrid);
        goals.sort(alongGrid);
      }

      const agents = scenario.agents.map((agent, index) => ({
        ...agent,
        start: starts[index],
        goal: goals[index]
      }));
      const obstacleCandidates = shuffle(shuffled.slice(requiredCells));
      const targetObstacles = Math.floor(cells.length * 0.08);
      const obstacles = [];
      for (const candidate of obstacleCandidates) {
        if (obstacles.length >= targetObstacles) break;
        obstacles.push(candidate);
        if (!openGridIsConnected(obstacles)) obstacles.pop();
      }

      scenario.agents = agents;
      scenario.obstacles = obstacles;
      syncAgentSelector();
      setEditMode(editMode);
      scenarioChanged(`Random setup ready · ${obstacles.length} obstacles · run CBS to calculate`);
    }

    function setEditMode(mode) {
      editMode = mode;
      document.querySelectorAll('.edit-mode').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      });
      const labels = {
        obstacle: 'Click cells to add or remove obstacles.',
        start: `Click a cell to place ${scenario.agents[selectedAgent].name}'s start.`,
        goal: `Click a cell to place ${scenario.agents[selectedAgent].name}'s goal.`,
        erase: 'Click a cell to remove an obstacle or a robot marker.'
      };
      document.querySelector('#edit-hint').textContent = labels[mode];
      canvas.style.cursor = 'crosshair';
    }

    function scenarioChanged(message) {
      result = null;
      conflicts = [];
      frame = 0;
      pause();
      sourceStatus.textContent = message || 'Scenario changed · run CBS to calculate';
      render();
    }

    function loadResult(data, label) {
      result = validateResult(data);
      scenario = {
        width: data.width,
        height: data.height,
        obstacles: data.obstacles.map(point => [...point]),
        agents: data.agents.map((agent, index) => ({
          name: agent.name || `Robot ${index + 1}`,
          start: agent.start ? [...agent.start] : [...agent.path[0]],
          goal: agent.goal ? [...agent.goal] : [...agent.path.at(-1)]
        }))
      };
      syncGridSizeInputs();
      selectedAgent = Math.min(selectedAgent, scenario.agents.length - 1);
      syncAgentSelector();
      conflicts = findConflicts();
      frame = 0;
      pause();
      sourceStatus.textContent = label;
      sourceStatus.title = label;
      render();
    }

    async function calculateScenario() {
      calculateButton.disabled = true;
      calculateButton.textContent = 'Calculating…';
      sourceStatus.textContent = 'CBS is searching for a solution…';
      try {
        const response = await fetch('/solve', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(scenario)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'CBS could not solve this scenario.');
        loadResult(data, 'CBS solution');
      } catch (error) {
        sourceStatus.textContent = error.message;
        sourceStatus.title = error.message;
      } finally {
        calculateButton.disabled = false;
        calculateButton.innerHTML = '<span aria-hidden="true">▶</span> Run CBS';
      }
    }

    function editCell(event) {
      const bounds = canvas.getBoundingClientRect();
      const margin = Math.max(28, Math.min(bounds.width, bounds.height) * .075);
      const cell = Math.min(
        (bounds.width - margin * 2) / scenario.width,
        (bounds.height - margin * 2) / scenario.height
      );
      const left = (bounds.width - cell * scenario.width) / 2;
      const top = (bounds.height - cell * scenario.height) / 2;
      const x = Math.floor((event.clientX - bounds.left - left) / cell);
      const y = Math.floor((event.clientY - bounds.top - top) / cell);
      if (x < 0 || x >= scenario.width || y < 0 || y >= scenario.height) return;
      const point = [x, y];
      const pointKey = ([pointX, pointY]) => `${pointX},${pointY}`;
      const key = pointKey(point);
      const obstacleIndex = scenario.obstacles.findIndex(obstacle => pointKey(obstacle) === key);

      if (editMode === 'obstacle') {
        if (obstacleIndex !== -1) {
          scenario.obstacles.splice(obstacleIndex, 1);
        } else if (scenario.agents.some(agent => pointKey(agent.start || [-1, -1]) === key
            || pointKey(agent.goal || [-1, -1]) === key)) {
          sourceStatus.textContent = 'Move the robot marker before placing an obstacle here.';
          return;
        } else {
          scenario.obstacles.push(point);
        }
      } else if (editMode === 'start' || editMode === 'goal') {
        if (obstacleIndex !== -1) {
          sourceStatus.textContent = 'A robot marker cannot be placed on an obstacle.';
          return;
        }
        const property = editMode;
        const alreadyUsed = scenario.agents.some((agent, index) => index !== selectedAgent
          && agent[property] && pointKey(agent[property]) === key);
        if (alreadyUsed) {
          sourceStatus.textContent = `Another robot already has this ${property}.`;
          return;
        }
        scenario.agents[selectedAgent][property] = point;
      } else {
        if (obstacleIndex !== -1) scenario.obstacles.splice(obstacleIndex, 1);
        for (const agent of scenario.agents) {
          if (agent.start && pointKey(agent.start) === key) agent.start = null;
          if (agent.goal && pointKey(agent.goal) === key) agent.goal = null;
        }
      }

      scenarioChanged();
    }

    function draw() {
      const bounds = canvas.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(bounds.width * ratio);
      canvas.height = Math.round(bounds.height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      const width = bounds.width;
      const height = bounds.height;
      context.clearRect(0, 0, width, height);
      context.fillStyle = '#e7eee6';
      context.fillRect(0, 0, width, height);

      const margin = Math.max(28, Math.min(width, height) * .075);
      const cell = Math.min((width - margin * 2) / scenario.width, (height - margin * 2) / scenario.height);
      const boardWidth = cell * scenario.width;
      const boardHeight = cell * scenario.height;
      const left = (width - boardWidth) / 2;
      const top = (height - boardHeight) / 2;
      const center = ([x, y]) => [left + (x + .5) * cell, top + (y + .5) * cell];

      context.fillStyle = '#f9fbf7';
      context.fillRect(left, top, boardWidth, boardHeight);
      context.strokeStyle = '#d4ded4';
      context.lineWidth = 1;
      for (let x = 0; x <= scenario.width; x += 1) {
        context.beginPath();
        context.moveTo(left + x * cell, top);
        context.lineTo(left + x * cell, top + boardHeight);
        context.stroke();
      }
      for (let y = 0; y <= scenario.height; y += 1) {
        context.beginPath();
        context.moveTo(left, top + y * cell);
        context.lineTo(left + boardWidth, top + y * cell);
        context.stroke();
      }

      for (const obstacle of scenario.obstacles) {
        const inset = cell * .12;
        context.fillStyle = '#29453b';
        context.beginPath();
        context.roundRect(left + obstacle[0] * cell + inset, top + obstacle[1] * cell + inset, cell - inset * 2, cell - inset * 2, Math.max(4, cell * .12));
        context.fill();
        context.fillStyle = 'rgba(255,255,255,.13)';
        context.fillRect(left + obstacle[0] * cell + inset * 1.8, top + obstacle[1] * cell + inset * 1.8, cell - inset * 3.6, Math.max(2, cell * .035));
      }

      if (result) {
        result.agents.forEach((agent, index) => {
          const color = colors[index % colors.length];
          context.save();
          context.globalAlpha = .2;
          context.strokeStyle = color;
          context.lineWidth = Math.max(2, cell * .055);
          context.lineCap = 'round';
          context.lineJoin = 'round';
          context.beginPath();
          agent.path.forEach((point, pointIndex) => {
            const [x, y] = center(point);
            if (pointIndex === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          });
          context.stroke();
          context.restore();
        });
      }

      scenario.agents.forEach((agent, index) => {
        const color = colors[index % colors.length];
        const radius = Math.max(5, cell * .25);
        if (agent.start) {
          const [x, y] = center(agent.start);
          context.beginPath();
          context.arc(x, y, radius * .72, 0, Math.PI * 2);
          context.strokeStyle = color;
          context.lineWidth = 2;
          context.setLineDash([3, 3]);
          context.stroke();
          context.setLineDash([]);
        }
        if (agent.goal) {
          const [x, y] = center(agent.goal);
          context.beginPath();
          context.arc(x, y, radius * .72, 0, Math.PI * 2);
          context.fillStyle = `${color}22`;
          context.fill();
          context.strokeStyle = color;
          context.lineWidth = 1.5;
          context.stroke();
        }
      });

      scenario.agents.forEach((scenarioAgent, index) => {
        const color = colors[index % colors.length];
        const agent = result && result.agents[index];
        let position = scenarioAgent.start;
        if (agent) {
          const low = Math.floor(frame);
          const fraction = frame - low;
          const from = agent.path[Math.min(low, agent.path.length - 1)];
          const to = agent.path[Math.min(low + 1, agent.path.length - 1)];
          position = [from[0] + (to[0] - from[0]) * fraction, from[1] + (to[1] - from[1]) * fraction];
        }
        if (!position) return;
        const [x, y] = center(position);
        const radius = Math.max(7, cell * .29);
        context.save();
        context.shadowColor = 'rgba(27, 47, 38, .22)';
        context.shadowBlur = 10;
        context.shadowOffsetY = 3;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fillStyle = color;
        context.fill();
        context.restore();
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.strokeStyle = '#fff';
        context.lineWidth = 2.5;
        context.stroke();
        context.fillStyle = '#fff';
        context.font = `700 ${Math.max(9, cell * .27)}px ui-sans-serif, system-ui, sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(String(index + 1), x, y + .5);
      });
    }

    function render() {
      updatePanel();
      draw();
    }

    function tick(timestamp) {
      if (!playing) return;
      if (!lastTick) {
        lastTick = timestamp;
        frameAtTick = frame;
      }
      const duration = Number(document.querySelector('#speed-select').value);
      frame = Math.min(maxTime(), frameAtTick + (timestamp - lastTick) / duration);
      if (frame >= maxTime()) {
        frame = maxTime();
        playing = false;
        updatePlayButton();
      }
      updatePlaybackReadout();
      draw();
      if (playing) animationId = requestAnimationFrame(tick);
    }

    function updatePlayButton() {
      playButton.textContent = playing ? 'Ⅱ' : '▶';
      playButton.title = playing ? 'Pause animation' : 'Play animation';
      playButton.setAttribute('aria-label', playButton.title);
    }

    function pause() {
      playing = false;
      cancelAnimationFrame(animationId);
      updatePlayButton();
    }

    document.querySelector('#load-button').addEventListener('click', () => document.querySelector('#file-input').click());
    document.querySelector('#file-input').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        loadResult(JSON.parse(await file.text()), file.name);
      } catch (error) {
        sourceStatus.textContent = error instanceof SyntaxError ? 'Invalid JSON file' : error.message;
        sourceStatus.title = sourceStatus.textContent;
      }
      event.target.value = '';
    });
    document.querySelectorAll('.edit-mode').forEach(button => {
      button.addEventListener('click', () => setEditMode(button.dataset.mode));
    });
    document.querySelector('#selected-agent').addEventListener('change', event => {
      selectedAgent = Number(event.target.value);
      syncAgentSelector();
      setEditMode(editMode);
    });
    document.querySelector('#agent-name').addEventListener('change', event => {
      const fallback = `Robot ${selectedAgent + 1}`;
      scenario.agents[selectedAgent].name = event.target.value.trim() || fallback;
      syncAgentSelector();
      setEditMode(editMode);
      scenarioChanged('Robot renamed · run CBS to calculate');
    });
    document.querySelector('#agent-name').addEventListener('keydown', event => {
      if (event.key === 'Enter') event.currentTarget.blur();
    });
    document.querySelector('#resize-grid').addEventListener('click', resizeGrid);
    document.querySelector('#random-setup').addEventListener('click', randomSetup);
    document.querySelectorAll('#grid-width, #grid-height').forEach(input => {
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') resizeGrid();
      });
    });
    document.querySelector('#add-agent').addEventListener('click', () => {
      if (scenario.agents.length >= 32) {
        sourceStatus.textContent = 'The solver supports up to 32 robots.';
        return;
      }
      const name = `Robot ${scenario.agents.length + 1}`;
      scenario.agents.push({name, start: null, goal: null});
      selectedAgent = scenario.agents.length - 1;
      syncAgentSelector();
      setEditMode('start');
      scenarioChanged(`${name} added · place its start and goal`);
    });
    document.querySelector('#remove-agent').addEventListener('click', () => {
      if (scenario.agents.length <= 1) return;
      scenario.agents.splice(selectedAgent, 1);
      selectedAgent = Math.min(selectedAgent, scenario.agents.length - 1);
      syncAgentSelector();
      setEditMode(editMode);
      scenarioChanged('Robot removed · run CBS to calculate');
    });
    document.querySelector('#calculate-button').addEventListener('click', calculateScenario);
    canvas.addEventListener('click', editCell);
    document.querySelector('#reset-button').addEventListener('click', () => { frame = 0; pause(); render(); });
    document.querySelector('#previous-button').addEventListener('click', () => { pause(); frame = Math.max(0, Math.floor(frame) - 1); render(); });
    document.querySelector('#next-button').addEventListener('click', () => { pause(); frame = Math.min(maxTime(), Math.floor(frame) + 1); render(); });
    playButton.addEventListener('click', () => {
      if (playing) {
        pause();
      } else {
        if (frame >= maxTime()) frame = 0;
        playing = true;
        lastTick = 0;
        updatePlayButton();
        animationId = requestAnimationFrame(tick);
      }
      render();
    });
    range.addEventListener('input', () => { pause(); frame = Number(range.value); render(); });
    document.querySelector('#speed-select').addEventListener('change', () => {
      if (playing) {
        frameAtTick = frame;
        lastTick = performance.now();
      }
    });
    window.addEventListener('resize', draw);
    window.addEventListener('keydown', event => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) return;
      if (event.code === 'Space') {
        event.preventDefault();
        playButton.click();
      } else if (event.code === 'ArrowRight') {
        document.querySelector('#next-button').click();
      } else if (event.code === 'ArrowLeft') {
        document.querySelector('#previous-button').click();
      }
    });

    syncAgentSelector();
    syncGridSizeInputs();
    setEditMode(editMode);
    conflicts = findConflicts();
    render();
  </script>
</body>
</html>
